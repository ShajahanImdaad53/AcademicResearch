<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <radialGradient id="onboardGlow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242126" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="metalArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A78"/>
      <stop offset="50%" stop-color="#FF7139"/>
      <stop offset="100%" stop-color="#9A2A0C"/>
    </linearGradient>
    <linearGradient id="slabCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5ED"/>
      <stop offset="100%" stop-color="#D9C9B4"/>
    </linearGradient>
    <linearGradient id="darkPodium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#353238"/>
      <stop offset="100%" stop-color="#1B1B20"/>
    </linearGradient>
    <filter id="cinematicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1000" height="750" fill="url(#onboardGlow)"/>

  <!-- Dramatic Curved Metallic Ribbons -->
  <path d="M 120 620 C 350 480, 520 220, 880 180" fill="none" stroke="url(#metalArc)" stroke-width="8" opacity="0.6"/>
  <path d="M 180 660 C 420 520, 600 280, 920 240" fill="none" stroke="url(#orbGrad)" stroke-width="4" opacity="0.4"/>
  <ellipse cx="650" cy="420" rx="280" ry="120" fill="none" stroke="#FF7139" stroke-opacity="0.15" stroke-width="2" transform="rotate(-15 650 420)"/>

  <!-- Stepped Podium -->
  <g filter="url(#cinematicShadow)">
    <polygon points="300,560 620,440 820,530 500,650" fill="url(#darkPodium)" stroke="#353238" stroke-width="2"/>
    <polygon points="380,480 640,390 760,450 500,540" fill="#242126" stroke="#353238" stroke-width="2"/>
  </g>

  <!-- Sculptural Educational Blocks / Books -->
  <g filter="url(#cinematicShadow)">
    <!-- Book Slab 1 -->
    <polygon points="420,410 580,350 630,375 470,435" fill="url(#metalArc)"/>
    <polygon points="470,435 630,375 630,415 470,475" fill="#C2410C"/>
    <polygon points="420,410 470,435 470,475 420,450" fill="#9A3412"/>

    <!-- Book Slab 2 -->
    <polygon points="440,360 600,300 650,325 490,385" fill="url(#slabCream)"/>
    <polygon points="490,385 650,325 650,350 490,410" fill="#D9C9B4"/>
    <polygon points="440,360 490,385 490,410 440,385" fill="#B6AEA5"/>

    <!-- Abstract Compass / Needle -->
    <polygon points="560,180 545,310 575,310" fill="url(#orbGrad)"/>
    <circle cx="560" cy="310" r="14" fill="url(#metalArc)"/>
  </g>

  <!-- Glowing Knowledge Spheres -->
  <circle cx="720" cy="280" r="55" fill="url(#orbGrad)" filter="url(#cinematicShadow)"/>
  <circle cx="340" cy="380" r="28" fill="url(#metalArc)" filter="url(#cinematicShadow)"/>
  <circle cx="480" cy="220" r="20" fill="url(#slabCream)" filter="url(#cinematicShadow)"/>
  <circle cx="820" cy="460" r="24" fill="url(#orbGrad)" filter="url(#cinematicShadow)"/>
</svg>
