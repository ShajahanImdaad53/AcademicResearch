<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242126" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#D48B28"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A"/>
      <stop offset="50%" stop-color="#FF7139"/>
      <stop offset="100%" stop-color="#A83210"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5ED"/>
      <stop offset="100%" stop-color="#D9C9B4"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#353238"/>
      <stop offset="100%" stop-color="#1B1B20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Orbital Rings -->
  <ellipse cx="400" cy="400" rx="320" ry="180" fill="none" stroke="#FF7139" stroke-opacity="0.15" stroke-width="2" transform="rotate(-25 400 400)"/>
  <ellipse cx="400" cy="400" rx="270" ry="140" fill="none" stroke="#FFC857" stroke-opacity="0.25" stroke-width="3" transform="rotate(35 400 400)"/>

  <!-- Pedestal -->
  <g filter="url(#shadow)">
    <ellipse cx="400" cy="620" rx="240" ry="50" fill="url(#darkMetal)"/>
    <ellipse cx="400" cy="610" rx="220" ry="40" fill="url(#copperGrad)" opacity="0.3"/>
  </g>

  <!-- 3D Geometric Notebook -->
  <g filter="url(#shadow)">
    <!-- Back Cover -->
    <path d="M 280 320 L 520 250 L 560 520 L 320 600 Z" fill="url(#darkMetal)" stroke="#353238" stroke-width="2"/>
    <!-- Pages Fan -->
    <path d="M 270 330 L 510 260 L 550 515 L 310 590 Z" fill="url(#creamGrad)" stroke="#B6AEA5" stroke-width="1.5"/>
    <path d="M 260 340 L 500 270 L 540 510 L 300 585 Z" fill="#FAF5ED" stroke="#B6AEA5" stroke-width="1"/>
    <!-- Page Lines -->
    <line x1="320" y1="360" x2="480" y2="310" stroke="#FF7139" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
    <line x1="330" y1="395" x2="490" y2="345" stroke="#FF7139" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
    <line x1="340" y1="430" x2="500" y2="380" stroke="#FF7139" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
    <line x1="350" y1="465" x2="510" y2="415" stroke="#FF7139" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Precision Floating Pen -->
  <g filter="url(#shadow)" transform="rotate(-35 460 330)">
    <!-- Pen Barrel -->
    <rect x="445" y="160" width="30" height="280" rx="8" fill="url(#copperGrad)"/>
    <!-- Gold Rings -->
    <rect x="443" y="240" width="34" height="10" rx="2" fill="url(#goldGrad)"/>
    <rect x="443" y="380" width="34" height="6" rx="1" fill="url(#goldGrad)"/>
    <!-- Nib -->
    <polygon points="460,480 448,440 472,440" fill="url(#goldGrad)"/>
    <!-- Nib tip slit -->
    <line x1="460" y1="440" x2="460" y2="475" stroke="#1B1B20" stroke-width="1.5"/>
  </g>

  <!-- Floating Spheres and Language Particles -->
  <circle cx="210" cy="380" r="28" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="580" cy="240" r="18" fill="url(#copperGrad)" filter="url(#shadow)"/>
  <circle cx="270" cy="220" r="14" fill="url(#creamGrad)" filter="url(#shadow)"/>
  <circle cx="560" cy="560" r="22" fill="url(#copperGrad)" filter="url(#shadow)"/>

  <!-- Precision Letterform Arcs -->
  <path d="M 180 280 C 180 200, 260 160, 340 180" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 520 180 C 600 200, 640 280, 610 360" fill="none" stroke="url(#copperGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
